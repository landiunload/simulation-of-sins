name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Development integration follows the engine branch while both repositories
  # evolve. Tags and release/* branches build the reviewed immutable SHA that
  # engine.lock holds instead; engine-revision below picks between the two.
  LAIUE_REF: main
  LLVM_VERSION: '22'
  ANDROID_NDK_VERSION: 30.0.16248370

jobs:
  engine-revision:
    name: Resolve engine revision
    runs-on: ubuntu-26.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Choose the laiue revision for this run
        id: resolve
        shell: bash
        run: |
          locked="$(grep -v '^[[:space:]]*#' engine.lock | tr -d '[:space:]')"
          if ! printf '%s' "$locked" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "engine.lock must hold one 40-character laiue commit SHA" >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/*|refs/heads/release/*) ref="$locked" ;;
            *)
              if [[ "$LAIUE_REF" =~ ^[0-9a-f]{40}$ ]]; then
                ref="$LAIUE_REF"
              else
                if ! git check-ref-format "refs/heads/$LAIUE_REF"; then
                  echo "LAIUE_REF must name a valid engine branch or commit SHA" >&2
                  exit 1
                fi
                if ! resolved="$(git ls-remote --exit-code \
                  https://github.com/landiunload/laiue.git "refs/heads/$LAIUE_REF")"; then
                  echo "Cannot resolve engine branch: $LAIUE_REF" >&2
                  exit 1
                fi
                IFS=$'\t' read -r ref resolved_ref <<< "$resolved"
                if [[ "$resolved" != "$ref"$'\t'"refs/heads/$LAIUE_REF" ]]; then
                  echo "Engine branch lookup returned an unexpected result" >&2
                  exit 1
                fi
              fi
              ;;
          esac
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved engine revision must be one 40-character commit SHA" >&2
            exit 1
          fi
          # Every matrix job checks out this same SHA even if main advances.
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "laiue revision for this run: $ref"

  windows:
    name: Windows ${{ matrix.architecture }} (${{ matrix.preset }})
    needs: engine-revision
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, architecture: x64, preset: windows-msvc}
          - {runner: windows-2025, architecture: x64, preset: windows-clang}
          - {runner: windows-11-arm, architecture: arm64, preset: windows-msvc-arm64}
          - {runner: windows-11-arm, architecture: arm64, preset: windows-clang-arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landiunload/laiue
          ref: ${{ needs.engine-revision.outputs.ref }}
          path: _engine
      - name: Activate compiler environment
        shell: pwsh
        run: |
          $component = if ('${{ matrix.architecture }}' -eq 'arm64') {
            'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          } else {
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * -requires $component `
            -property installationPath
          if (!$vsRoot) { throw "Visual Studio C tools were not found: $component" }
          $vsRoot = @($vsRoot)[0].Trim()
          Import-Module (Join-Path $vsRoot `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot -SkipAutomaticLocation `
            -DevCmdArguments '-arch=${{ matrix.architecture }} -host_arch=${{ matrix.architecture }}'
          # Visual Studio's bundled CMake lags behind the runner's; both
          # projects need CMake 4.2 or newer.
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -notlike '*\Microsoft\CMake\*' }) -join ';'
          cmake --version
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" |
              Out-File $env:GITHUB_ENV -Append
          }
      - name: Build engine SDK
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -S _engine
          cmake --build "_engine/build/${{ matrix.preset }}" --config Release `
            --target laiue_engine_bundle --parallel
      - name: Configure game
        shell: pwsh
        run: |
          $engine = Join-Path $env:GITHUB_WORKSPACE `
            "_engine/build/${{ matrix.preset }}/bundles/engine/Release/lib/cmake/laiue"
          $arguments = @('--preset', '${{ matrix.preset }}', "-Dlaiue_DIR=$engine")
          if ('${{ matrix.preset }}' -eq 'windows-clang') {
            $arguments += '-DSOS_ENABLE_CLANG_TIDY=ON'
          }
          cmake @arguments
      - name: Build and test Debug
        run: |
          cmake --build --preset ${{ matrix.preset }}-debug --parallel
          ctest --preset ${{ matrix.preset }}-debug --no-tests=error --output-on-failure
      - name: Build and test Release
        run: |
          cmake --build --preset ${{ matrix.preset }}-release --parallel
          ctest --preset ${{ matrix.preset }}-release --no-tests=error --output-on-failure
      - name: Build and test the game with the engine from source
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $build = "build/source-${{ matrix.preset }}"
          cmake --preset ${{ matrix.preset }} -B $build `
            "-DSOS_ENGINE_SOURCE_DIR=$env:GITHUB_WORKSPACE/_engine" `
            -DSOS_ENGINE_FETCH=OFF -Dlaiue_DIR=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($configuration in 'Debug', 'Release') {
            cmake --build $build --config $configuration --parallel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ctest --test-dir $build -C $configuration --no-tests=error --output-on-failure
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Stage and smoke-test the bundle
        if: matrix.preset == 'windows-msvc'
        shell: pwsh
        run: |
          cmake --build --preset windows-msvc-release --target simulation_of_sins_bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build/windows-msvc/bundles/SimulationOfSins/Release'
          # A windowed program returns to PowerShell at once; wait explicitly.
          $smoke = Start-Process -PassThru -Wait -NoNewWindow -WorkingDirectory $bundle `
            -FilePath (Join-Path $bundle 'SimulationOfSins.exe') -ArgumentList '--smoke'
          if ($smoke.ExitCode -ne 0) {
            throw "Staged bundle smoke failed with exit code $($smoke.ExitCode)"
          }
      - name: Upload bundle
        if: matrix.preset == 'windows-msvc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulation-of-sins-windows-x86_64
          path: build/windows-msvc/bundles/SimulationOfSins/Release
          if-no-files-found: error
      - name: Verify the builds did not modify sources
        shell: pwsh
        run: |
          foreach ($tree in '.', '_engine') {
            git -C $tree diff --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $changes = git -C $tree status --porcelain
            if ($changes) { throw "Build modified sources in ${tree}:`n$changes" }
          }

  linux:
    name: Linux ${{ matrix.architecture }} headless (${{ matrix.preset }})
    needs: engine-revision
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-26.04, architecture: x86_64, preset: linux-gcc}
          - {runner: ubuntu-26.04, architecture: x86_64, preset: linux-clang}
          - {runner: ubuntu-26.04-arm, architecture: arm64, preset: linux-gcc-arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landiunload/laiue
          ref: ${{ needs.engine-revision.outputs.ref }}
          path: _engine
      - name: Use the pinned Clang
        if: matrix.preset == 'linux-clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION"
          sudo update-alternatives --install /usr/bin/clang clang "/usr/bin/clang-$LLVM_VERSION" 200
          clang --version
      - name: Build headless engine SDK
        run: |
          test "$(uname -m)" = "${{ matrix.architecture == 'arm64' && 'aarch64' || 'x86_64' }}"
          cmake --preset "${{ matrix.preset }}" -S _engine -DLAIUE_BUILD_GRAPHICS=OFF
          cmake --build "_engine/build/${{ matrix.preset }}" --config Release \
            --target laiue_engine_bundle --parallel
      - name: Configure game
        run: |
          engine="$GITHUB_WORKSPACE/_engine/build/${{ matrix.preset }}/bundles/engine/Release/lib/cmake/laiue"
          cmake --preset "${{ matrix.preset }}" "-Dlaiue_DIR=$engine"
      - name: Build and test Debug
        run: |
          cmake --build --preset "${{ matrix.preset }}-debug" --parallel
          ctest --preset "${{ matrix.preset }}-debug" --no-tests=error --output-on-failure
      - name: Build and test Release
        run: |
          cmake --build --preset "${{ matrix.preset }}-release" --parallel
          ctest --preset "${{ matrix.preset }}-release" --no-tests=error --output-on-failure
      - name: Build and test the external-platform superbuild
        if: matrix.preset == 'linux-gcc'
        run: |
          cmake --preset linux-external-superbuild-smoke \
            -DSOS_ENGINE_SOURCE_DIR="$GITHUB_WORKSPACE/_engine" \
            -DLAIUE_EXTERNAL_PLATFORM_FILE="$GITHUB_WORKSPACE/_engine/tests/external_port/adapter.cmake"
          cmake --build --preset linux-external-superbuild-smoke-release --parallel
          ctest --preset linux-external-superbuild-smoke-release --no-tests=error --output-on-failure
      - name: Verify the builds did not modify sources
        run: |
          for tree in . _engine; do
            git -C "$tree" diff --check
            test -z "$(git -C "$tree" status --porcelain)"
          done

  android:
    name: Android ARM64 game
    needs: engine-revision
    runs-on: ubuntu-26.04
    env:
      SOS_ANDROID_PLATFORM: android-37.0
      SOS_ANDROID_BUILD_TOOLS: 37.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landiunload/laiue
          ref: ${{ needs.engine-revision.outputs.ref }}
          path: _engine
      - name: Install the pinned Android NDK, build tools and platform
        run: |
          # Downloads from dl.google.com occasionally break off (Premature EOF).
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
              "ndk;$ANDROID_NDK_VERSION" "build-tools;$SOS_ANDROID_BUILD_TOOLS" \
              "platforms;$SOS_ANDROID_PLATFORM" > /dev/null && break
            echo "::warning::Android SDK download attempt $attempt failed"
            sleep 20
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake"
          test -f "$ANDROID_HOME/platforms/$SOS_ANDROID_PLATFORM/android.jar"
          test -x "$ANDROID_HOME/build-tools/$SOS_ANDROID_BUILD_TOOLS/aapt2"
      - name: Link the complete game and engine closure without LTO
        run: |
          cmake --preset android-arm64-core-closure \
            -DSOS_ENGINE_SOURCE_DIR="$GITHUB_WORKSPACE/_engine" \
            -DLAIUE_EXTERNAL_PLATFORM_FILE="$GITHUB_WORKSPACE/_engine/cmake/platform/MobileCoreAdapter.cmake"
          cmake --build --preset android-arm64-core-closure --parallel
      - name: Build the Release native library
        run: |
          cmake --preset android-arm64-core \
            -DSOS_ENGINE_SOURCE_DIR="$GITHUB_WORKSPACE/_engine" \
            -DLAIUE_EXTERNAL_PLATFORM_FILE="$GITHUB_WORKSPACE/_engine/cmake/platform/MobileCoreAdapter.cmake"
          cmake --build --preset android-arm64-core-release --parallel
      - name: Build and sign the application
        run: |
          # A key made for this run: install over an earlier build only after
          # removing it.
          keytool -genkeypair -keystore "$RUNNER_TEMP/sos-debug.p12" \
            -storetype PKCS12 -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=Android Debug,O=Android,C=US'
          tools="$ANDROID_HOME/build-tools/$SOS_ANDROID_BUILD_TOOLS"
          cmake --preset android-arm64-app \
            -DSOS_ENGINE_SOURCE_DIR="$GITHUB_WORKSPACE/_engine" \
            -DLAIUE_EXTERNAL_PLATFORM_FILE="$GITHUB_WORKSPACE/_engine/cmake/platform/MobileCoreAdapter.cmake" \
            -DSOS_ANDROID_AAPT2="$tools/aapt2" \
            -DSOS_ANDROID_ZIPALIGN="$tools/zipalign" \
            -DSOS_ANDROID_APKSIGNER="$tools/apksigner" \
            -DSOS_ANDROID_FRAMEWORK_JAR="$ANDROID_HOME/platforms/$SOS_ANDROID_PLATFORM/android.jar" \
            -DSOS_ANDROID_KEYSTORE="$RUNNER_TEMP/sos-debug.p12"
          cmake --build --preset android-arm64-app-release \
            --target simulation_of_sins_android_apk --parallel
      - name: Upload the application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulation-of-sins-android-arm64
          path: build/android-arm64-app/apk/SimulationOfSins.apk
          if-no-files-found: error
      - name: Verify the builds did not modify sources
        run: |
          for tree in . _engine; do
            git -C "$tree" diff --check
            test -z "$(git -C "$tree" status --porcelain)"
          done

  macos:
    name: macOS ${{ matrix.architecture }} headless
    needs: engine-revision
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-26, architecture: arm64, preset: macos-clang-arm64}
          - {runner: macos-26-intel, architecture: x86_64, preset: macos-clang-x86_64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landiunload/laiue
          ref: ${{ needs.engine-revision.outputs.ref }}
          path: _engine
      - name: Install build dependencies
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
      - name: Build headless engine SDK
        run: |
          cmake --preset "${{ matrix.preset }}" -S _engine -DLAIUE_BUILD_GRAPHICS=OFF
          cmake --build "_engine/build/${{ matrix.preset }}" --config Release \
            --target laiue_engine_bundle --parallel
      - name: Configure game
        run: |
          engine="$GITHUB_WORKSPACE/_engine/build/${{ matrix.preset }}/bundles/engine/Release/lib/cmake/laiue"
          cmake --preset "${{ matrix.preset }}" "-Dlaiue_DIR=$engine"
      - name: Build and test Debug
        run: |
          cmake --build --preset "${{ matrix.preset }}-debug" --parallel
          ctest --preset "${{ matrix.preset }}-debug" --no-tests=error --output-on-failure
      - name: Build and test Release
        run: |
          cmake --build --preset "${{ matrix.preset }}-release" --parallel
          ctest --preset "${{ matrix.preset }}-release" --no-tests=error --output-on-failure
      - name: Link the iOS ARM64 game and engine
        if: matrix.architecture == 'arm64'
        run: |
          xcodebuild -version
          cmake --preset ios-arm64-core \
            -DSOS_ENGINE_SOURCE_DIR="$GITHUB_WORKSPACE/_engine" \
            -DLAIUE_EXTERNAL_PLATFORM_FILE="$GITHUB_WORKSPACE/_engine/cmake/platform/MobileCoreAdapter.cmake"
          cmake --build --preset ios-arm64-core-debug --parallel
          cmake --build --preset ios-arm64-core-release --parallel
      - name: Verify the builds did not modify sources
        run: |
          for tree in . _engine; do
            git -C "$tree" diff --check
            test -z "$(git -C "$tree" status --porcelain)"
          done

  ci:
    name: All checks
    if: always()
    needs: [engine-revision, windows, linux, android, macos]
    runs-on: ubuntu-slim
    steps:
      - name: Require every job to pass
        if: >
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
